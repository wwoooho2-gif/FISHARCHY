# FISHARCHY performance + stability sysctl. One file, every setting commented.
# Measure: `sysctl <key>`, `fisharchy-bench`, `cat /proc/pressure/memory`.

# Many games (Proton/Wine, Unity) crash with "out of memory" below this map count.
vm.max_map_count = 1048576
# With zram swap, swapping is cheap RAM-to-RAM compression; a high value keeps file cache warm.
vm.swappiness = 150
# Read one page at a time from zram (no readahead benefit on compressed RAM).
vm.page-cluster = 0
# Keep dentry/inode caches a bit longer: faster launches and game asset streaming.
vm.vfs_cache_pressure = 50
# Wake kswapd earlier so allocations stall less under memory pressure.
vm.watermark_scale_factor = 125
# Start background writeback at 5% and block writers at 10% of RAM: smaller stalls on slow disks.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
# Flush dirty pages every 15 s instead of 30 s so less data is lost in a crash.
vm.dirty_writeback_centisecs = 1500

# BBR congestion control with the fq qdisc: better throughput and lower latency on lossy links.
net.core.default_qdisc = fq
net.ipv4.tcp_congestion_control = bbr
# TCP Fast Open for client and server: saves a round trip on repeat connections.
net.ipv4.tcp_fastopen = 3
# Probe path MTU when a black hole is detected: avoids stuck connections on odd networks.
net.ipv4.tcp_mtu_probing = 1
# Do not drop to slow-start after idle: keeps long-lived connections fast.
net.ipv4.tcp_slow_start_after_idle = 0
