# zram swap via zram-generator. zswap is disabled on the kernel command line
# (zswap.enabled=0), so zram and zswap are never both active.
[zram0]
# Half of RAM, capped at 8 GiB: enough headroom without letting swap eat memory.
zram-size = min(ram / 2, 8192)
# zstd: best compression ratio at acceptable CPU cost.
compression-algorithm = zstd
# High priority so zram is always used before any disk swap.
swap-priority = 100
# Swap device type.
fs-type = swap
