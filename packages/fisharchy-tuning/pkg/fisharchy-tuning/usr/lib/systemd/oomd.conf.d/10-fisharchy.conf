# systemd-oomd tuning (chosen over earlyoom: ships with systemd, works per-cgroup, so it
# kills a whole game/browser scope instead of a random PID, and needs no extra package).
[OOM]
# Act when swap use is above 90% (zram full) ...
SwapUsedLimit=90%
# ... or when a cgroup has been under memory pressure above 60% for 20 s.
DefaultMemoryPressureLimit=60%
DefaultMemoryPressureDurationSec=20s
