# Keep crash dumps small and bounded so they never fill the disk.
[Coredump]
# Store dumps as files (list them with `coredumpctl`).
Storage=external
# Skip dumping huge processes (games can be many GB).
ProcessSizeMax=1G
ExternalSizeMax=1G
# Total space for all dumps.
MaxUse=1G
# Always leave this much disk free.
KeepFree=2G
