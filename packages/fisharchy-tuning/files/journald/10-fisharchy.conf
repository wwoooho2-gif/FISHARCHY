# Keep the previous boot's logs (needed by fisharchy-crashlog) but cap disk use.
[Journal]
# Persistent: logs from before a crash survive the reboot.
Storage=persistent
# Hard cap on total journal size.
SystemMaxUse=300M
# Per-file cap keeps rotation granular.
SystemMaxFileSize=32M
# Drop entries older than a month.
MaxRetentionSec=1month
# Do not forward to syslog: less I/O.
ForwardToSyslog=no
